# Optional: pings Supabase every 3 days so the free project doesn't auto-pause after a week idle.
name: Supabase keep-alive
on:
  schedule: [{ cron: '17 3 */3 * *' }]
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/progress?select=user_id&limit=1" -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}"
